name: Build RAHUL STUDIO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAHUL_STUDIO_18_1_ANDROID_AUTO_BUILD_REVISED.zip'
      - '.github/workflows/build-apk.yml'
Siapkan Java JDK melalui langkah-langkah
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q RAHUL_STUDIO_18_1_ANDROID_AUTO_BUILD.zip -d source

      - name: Build APK
        working-directory: source/RAHUL_STUDIO_18_1_ANDROID
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RAHUL-STUDIO-18.1-APK
          path: source/RAHUL_STUDIO_18_1_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
