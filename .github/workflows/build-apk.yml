
name: Build RAHUL STUDIO 20.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAHUL_STUDIO_20_0_ANDROID_FOUNDATION.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q RAHUL_STUDIO_20_0_ANDROID_FOUNDATION.zip -d source

      - name: Build debug APK
        working-directory: source/RAHUL_STUDIO_18_1_ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAHUL-STUDIO-20.0-APK
          path: source/RAHUL_STUDIO_18_1_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
